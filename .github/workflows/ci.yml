name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret grep (blocks on keys/tokens/credentials)
        run: |
          SECRET_RE='sk-[A-Za-z0-9]{8,}|gho_[A-Za-z0-9]+|ghp_[A-Za-z0-9]+|api[_-]?key[[:space:]]*[:=][[:space:]]*"?[^[:space:]"]{8,}|bearer [A-Za-z0-9_.-]{8,}|BEGIN (RSA )?PRIVATE KEY'
          if git grep -n -i -E "$SECRET_RE" -- . ':!.git'; then
            echo "SECRET PATTERN FOUND — failing"; exit 1
          fi
          echo "secret grep clean"
          test ! -e .env || { echo ".env committed — failing"; exit 1; }
          test ! -e prototype/capability-registry.json || python3 benchmarks/schema_check.py
      - name: Markdown lint (presence + fences)
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in list(pathlib.Path('.').rglob('*.md')):
              if '.git' in p.parts: continue
              t = p.read_text(errors='replace')
              if t.count('```') % 2:
                  bad.append(str(p))
          sys.exit(f"unclosed fences: {bad}" if bad else print(f"markdown ok"))
          PY
      - name: JSON schema check
        run: python3 benchmarks/schema_check.py
      - name: Fam-R pilot smoke (2 tasks, local only)
        run: python3 benchmarks/fam-r/run_checker.py --tasks r01,r02
