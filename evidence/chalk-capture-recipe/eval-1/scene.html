<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
// chalk scene: title writes in, then a chalk underline draws left-to-right.
// deterministic: frame N maps to t = N/60 s.
window.__cineFrame = function(n) {
  const t = n / 60;
  ctx.fillStyle = '#243b2f'; ctx.fillRect(0, 0, 960, 540);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
  ctx.strokeRect(40, 40, 880, 460);
  ctx.fillStyle = '#f5f1e6';
  ctx.font = '700 72px Caveat, cursive';
  ctx.fillText('Chalk works', 120, 200);
  ctx.font = '400 40px Caveat, cursive';
  ctx.fillText('frame ' + n + ' = t ' + t.toFixed(2) + 's', 120, 260);
  // progressive chalk underline, 1s..4s
  const p = Math.max(0, Math.min(1, (t - 1) / 3));
  if (p > 0) {
    ctx.strokeStyle = '#ffd98e'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let x = 0; x <= 500 * p; x += 8) {
      const y = 320 + Math.sin(x / 23 + n / 9) * 3;
      x === 0 ? ctx.moveTo(120 + x, y) : ctx.lineTo(120 + x, y);
    }
    ctx.stroke();
    // chalk hand cursor at tip
    ctx.fillStyle = '#f5f1e6';
    ctx.beginPath(); ctx.arc(120 + 500 * p, 320 + Math.sin(500 * p / 23 + n / 9) * 3, 9, 0, 7); ctx.fill();
  }
};
</script></body></html>
